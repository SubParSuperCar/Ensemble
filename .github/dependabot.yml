version: 2
updates:
  - package-ecosystem: 'nuget'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '0 0 */3 * *'
    # Bumped by hand in Directory.Packages.props: Estragonia/Lib/Avalonia.Skia.dll is patched against one
    # Avalonia version and its SkiaSharp, GodotSharp must match EnsembleGame.csproj's Godot.NET.Sdk, and
    # Meziantou.Analyzer floats
    ignore:
      - dependency-name: 'Avalonia'
      - dependency-name: 'Avalonia.HarfBuzz'
      - dependency-name: 'Avalonia.Skia'
      - dependency-name: 'Avalonia.Themes.Simple'
      - dependency-name: 'Avalonia.Wayland'
      - dependency-name: 'Avalonia.X11'
      - dependency-name: 'GodotSharp'
      - dependency-name: 'Meziantou.Analyzer'
      - dependency-name: 'SkiaSharp*'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
