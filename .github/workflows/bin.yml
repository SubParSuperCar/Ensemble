name: Build Release Binaries

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1
  GODOT_MONO_URL_LINUX: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip
  GODOT_MONO_URL_WIN: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip
  GODOT_TEMPLATES_URL: https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Verify addon native binaries are present
        run: |
          echo "Checking for GDExtension native libraries required by export..."
          MISSING=0
          for f in \
            "addons/terrain_3d/bin/libterrain.linux.release.x86_64.so" \
          ; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required native binary: $f"
              MISSING=1
            else
              echo "OK: $f ($(stat -c%s "$f") bytes)"
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "One or more GDExtension binaries are missing from the checkout."
            echo "Check whether these are committed to git, tracked via Git LFS,"
            echo "or need to be downloaded from the addon's release page (e.g."
            echo "Terrain3D releases: https://github.com/TokisanGames/Terrain3D/releases)"
            echo "and placed under addons/terrain_3d/bin/ before export."
            exit 1
          fi

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot install
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-linux
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-mono

      - name: Download & install Godot (Linux)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot-linux
          curl -L -o godot.zip "$GODOT_MONO_URL_LINUX"
          unzip -q godot.zip -d ~/godot-linux
          find ~/godot-linux -maxdepth 2 -type f -name "Godot_v4.7.1-stable_mono_linux.x86_64" -exec chmod +x {} \;

      - name: Download & install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.local/share/godot/export_templates
          curl -L -o templates.tpz "$GODOT_TEMPLATES_URL"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"

      - name: Locate Godot binary
        id: godot-bin
        run: |
          BIN=$(find ~/godot-linux -maxdepth 2 -type f -name "Godot_v4.7.1-stable_mono_linux.x86_64" | head -n1)
          if [ -z "$BIN" ]; then
            echo "Godot binary not found!" >&2
            find ~/godot-linux
            exit 1
          fi
          chmod +x "$BIN"
          echo "path=$BIN" >> "$GITHUB_OUTPUT"

      - name: Import project (headless)
        run: |
          "${{ steps.godot-bin.outputs.path }}" --headless --import 2>&1 | tee import_log.txt

      - name: Build C# solution (headless)
        run: |
          "${{ steps.godot-bin.outputs.path }}" --headless --build-solutions --quit 2>&1 | tee build_log.txt
          if grep -Eqi "error" build_log.txt; then
            echo "::error::C# build reported errors — see build_log.txt"
            exit 1
          fi

      - name: Prepare export output dir
        run: mkdir -p builds/linux-x86_64

      - name: Godot headless export (Linux)
        run: |
          "${{ steps.godot-bin.outputs.path }}" \
            --headless \
            --verbose \
            --export-release "Linux (x86_64)" \
            builds/linux-x86_64/Ensemble.x86_64 2>&1 | tee export_log.txt
          if grep -Eqi "ERROR|Failed to export|Cannot export|Failed to open|Failed to copy" export_log.txt; then
            echo "::error::Export step reported an internal error — see export_log.txt"
            exit 1
          fi

      - name: Verify export output
        run: |
          ls -la builds/linux-x86_64/
          test -f builds/linux-x86_64/Ensemble.x86_64 || (echo "Export did not produce expected binary" && exit 1)

      - name: Zip artifact
        run: |
          cd builds/linux-x86_64
          zip -r ../../Ensemble-linux-x86_64.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ensemble-linux-x86_64
          path: Ensemble-linux-x86_64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-debug-logs
          path: |
            import_log.txt
            build_log.txt
            export_log.txt

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Verify addon native binaries are present
        shell: pwsh
        run: |
          $required = @(
            "addons\terrain_3d\bin\libterrain.windows.release.x86_64.dll"
          )
          $missing = $false
          foreach ($f in $required) {
            if (-not (Test-Path $f)) {
              Write-Host "::error::Missing required native binary: $f"
              $missing = $true
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($missing) {
            Write-Host ""
            Write-Host "One or more GDExtension binaries are missing from the checkout."
            Write-Host "Check whether these are committed to git, tracked via Git LFS,"
            Write-Host "or need to be downloaded from the addon's release page."
            exit 1
          }

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot install
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            C:\godot-win
            C:\Users\runneradmin\AppData\Roaming\Godot\export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-mono

      - name: Download & install Godot (Windows)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\godot-win | Out-Null
          Invoke-WebRequest -Uri $env:GODOT_MONO_URL_WIN -OutFile godot.zip
          Expand-Archive -Path godot.zip -DestinationPath C:\godot-win -Force

      - name: Download & install export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dest = "$env:APPDATA\Godot\export_templates\$($env:GODOT_VERSION).stable.mono"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri $env:GODOT_TEMPLATES_URL -OutFile templates.tpz
          Expand-Archive -Path templates.tpz -DestinationPath C:\temp-templates -Force
          Copy-Item -Path "C:\temp-templates\templates\*" -Destination $dest -Recurse -Force

      - name: Locate Godot binary
        id: godot-bin
        shell: pwsh
        run: |
          $bin = Get-ChildItem -Path C:\godot-win -Recurse -Filter "Godot_v4.7.1-stable_mono_win64.exe" | Select-Object -First 1
          if (-not $bin) {
            Write-Error "Godot binary not found!"
            Get-ChildItem -Path C:\godot-win -Recurse
            exit 1
          }
          echo "path=$($bin.FullName)" >> $env:GITHUB_OUTPUT

      - name: Import project (headless)
        shell: pwsh
        run: |
          & "${{ steps.godot-bin.outputs.path }}" --headless --import 2>&1 | Tee-Object -FilePath import_log.txt

      - name: Build C# solution (headless)
        shell: pwsh
        run: |
          & "${{ steps.godot-bin.outputs.path }}" --headless --build-solutions --quit 2>&1 | Tee-Object -FilePath build_log.txt
          if (Select-String -Path build_log.txt -Pattern "error" -Quiet) {
            Write-Error "C# build reported errors — see build_log.txt"
            exit 1
          }

      - name: Prepare export output dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path builds\win-x86_64 | Out-Null

      - name: Godot headless export (Windows)
        shell: pwsh
        run: |
          & "${{ steps.godot-bin.outputs.path }}" `
            --headless `
            --verbose `
            --export-release "Windows (x86_64)" `
            builds\win-x86_64\Ensemble.exe 2>&1 | Tee-Object -FilePath export_log.txt
          if (Select-String -Path export_log.txt -Pattern "ERROR|Failed to export|Cannot export|Failed to open|Failed to copy" -Quiet) {
            Write-Error "Export step reported an internal error — see export_log.txt"
            exit 1
          }

      - name: Verify export output
        shell: pwsh
        run: |
          Get-ChildItem builds\win-x86_64
          if (-not (Test-Path builds\win-x86_64\Ensemble.exe)) {
            Write-Error "Export did not produce expected binary"
            exit 1
          }

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path builds\win-x86_64\* -DestinationPath Ensemble-win-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ensemble-win-x86_64
          path: Ensemble-win-x86_64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-debug-logs
          path: |
            import_log.txt
            build_log.txt
            export_log.txt
