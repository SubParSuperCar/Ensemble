name: Build Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: bin-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify build
        run: |
          set -euo pipefail
          id="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || id="$(git rev-parse --short HEAD)"
          echo "ID=${id}" >> "${GITHUB_ENV}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Godot
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d "${HOME}/godot"
          unzip -q templates.tpz -d "${HOME}/tpl"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          mv "${HOME}/tpl/templates" "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          bin="${HOME}/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "${bin}"
          echo "GODOT=${bin}" >> "${GITHUB_ENV}"

      - name: Neuter Terrain3D editor plugin
        run: mv addons/terrain_3d/plugin.cfg addons/terrain_3d/plugin.cfg.off

      - name: Disable threaded import
        run: printf '\n[editor]\n\nimport/use_multiple_threads=false\n' >> project.godot

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportRelease --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-release "Linux (x86_64)" "${PWD}/out/Ensemble.x86_64"
          test -s out/Ensemble.x86_64
          cd out
          shopt -s nullglob
          for d in data_*/; do cp -a "${d}." . && find "${d}" -mindepth 1 -delete; done
          chmod +x Ensemble.x86_64 Ensemble.sh

      - name: Package
        run: |
          set -euo pipefail
          cd out
          cp ../.github/scripts/symbolize.sh .
          zip -6 -ry "../Ensemble-${ID}-linux-x86_64-debug.zip" .
          rm -f ./*.pdb ./*.dbg ./*.xml symbolize.sh
          zip -6 -ry "../Ensemble-${ID}-linux-x86_64.zip" .

      - name: Smoke test
        run: |
          set -euo pipefail
          cd out
          timeout 120 ./Ensemble.x86_64 --headless --quit-after 900 -- --port=7777 > ../smoke.log 2>&1 || { tail -50 ../smoke.log; exit 1; }
          grep -qF 'Instantiated and added "WorldHandle"' ../smoke.log || { tail -50 ../smoke.log; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Ensemble-${{ env.ID }}-linux-x86_64
          path: Ensemble-${{ env.ID }}-linux-x86_64*.zip
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify build
        run: |
          set -euo pipefail
          id="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || id="$(git rev-parse --short HEAD)"
          echo "ID=${id}" >> "${GITHUB_ENV}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d "${HOME}/godot"
          unzip -q templates.tpz -d "${HOME}/tpl"
          template_dir="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "${template_dir}"
          mv "${HOME}/tpl/templates"/* "${template_dir}/"
          bin="${HOME}/godot/Godot_mono.app/Contents/MacOS/Godot"
          chmod +x "${bin}"
          echo "GODOT=${bin}" >> "${GITHUB_ENV}"

      - name: Neuter Terrain3D editor plugin
        run: mv addons/terrain_3d/plugin.cfg addons/terrain_3d/plugin.cfg.off

      - name: Disable threaded import
        run: printf '\n[editor]\n\nimport/use_multiple_threads=false\n' >> project.godot

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportRelease --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-release "Crapple macOS" "${PWD}/out/Ensemble.app"
          test -d out/Ensemble.app
          test -s out/Ensemble.app/Contents/MacOS/Ensemble

      - name: Package
        run: |
          set -euo pipefail
          cd out
          codesign --verify --deep --strict Ensemble.app
          ditto -c -k --sequesterRsrc --keepParent Ensemble.app "../Ensemble-${ID}-macos-universal-debug.zip"
          find Ensemble.app -name '*.pdb' -delete
          find Ensemble.app -name '*.dSYM' -type d -exec rm -rf {} +
          codesign --force --deep --sign - Ensemble.app
          codesign --verify --deep --strict Ensemble.app
          ditto -c -k --sequesterRsrc --keepParent Ensemble.app "../Ensemble-${ID}-macos-universal.zip"

      - name: Smoke test
        run: |
          set -euo pipefail
          perl -e 'alarm shift; exec @ARGV' 120 out/Ensemble.app/Contents/MacOS/Ensemble \
            --headless --quit-after 900 -- --port=7777 > smoke.log 2>&1 || { tail -50 smoke.log; exit 1; }
          grep -qF 'Instantiated and added "WorldHandle"' smoke.log || { tail -50 smoke.log; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Ensemble-${{ env.ID }}-macos-universal
          path: Ensemble-${{ env.ID }}-macos-universal*.zip
          if-no-files-found: error

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: pwsh

    env:
      GODOT_USER_DIR: C:\Users\runneradmin\AppData\Roaming\Godot

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify build
        run: |
          $id = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { git rev-parse --short HEAD }
          "ID=$id" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Godot
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.tpz
          Expand-Archive godot.zip -DestinationPath C:\godot -Force
          Expand-Archive templates.tpz -DestinationPath C:\tpl -Force
          $dest = "$env:GODOT_USER_DIR\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item C:\tpl\templates\* $dest -Force
          $exe = (Get-ChildItem C:\godot -Recurse -Filter *_win64.console.exe | Select-Object -First 1) ??
                 (Get-ChildItem C:\godot -Recurse -Filter *_win64.exe | Select-Object -First 1)
          "GODOT=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Neuter Terrain3D editor plugin
        run: Move-Item addons\terrain_3d\plugin.cfg addons\terrain_3d\plugin.cfg.off

      - name: Disable threaded import
        run: Add-Content project.godot "`n[editor]`n`nimport/use_multiple_threads=false`n"

      - name: Export
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build EnsembleGame.csproj -c ExportRelease
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
          dotnet build-server shutdown
          & $env:GODOT --headless --path . --import | Out-Host
          & $env:GODOT --headless --path . --import | Out-Host
          New-Item -ItemType Directory -Force out | Out-Null
          & $env:GODOT --headless --path . --export-release "Microslop Windows (x86_64)" "$PWD\out\Ensemble.exe" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path out\Ensemble.exe) -or (Get-Item out\Ensemble.exe).Length -eq 0) {
            throw "Ensemble.exe missing or empty after export"
          }
          Set-Location out
          Get-ChildItem -Directory -Filter data_* | ForEach-Object {
            Copy-Item "$($_.FullName)\*" . -Recurse -Force
            Remove-Item "$($_.FullName)\*" -Recurse -Force
          }

      - name: Package
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location out
          7z a -tzip -mx=5 -mmt=on "..\Ensemble-${env:ID}-windows-x86_64-debug.zip" . > $null
          Remove-Item *.pdb, *.xml -Force -ErrorAction SilentlyContinue
          7z a -tzip -mx=5 -mmt=on "..\Ensemble-${env:ID}-windows-x86_64.zip" . > $null

      - name: Smoke test
        run: |
          $process = Start-Process out\Ensemble.console.exe -ArgumentList '--headless', '--quit-after', '900', '--', '--port=7777' `
            -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err.log -NoNewWindow -PassThru
          $null = $process.Handle
          $exited = $process.WaitForExit(120000)
          Get-Process Ensemble* -ErrorAction SilentlyContinue | Stop-Process -Force
          $found = Select-String -Path smoke.log -Pattern 'Instantiated and added "WorldHandle"' -SimpleMatch -Quiet
          if (-not $exited -or $process.ExitCode -ne 0 -or -not $found) {
            Get-Content smoke.log, smoke.err.log -Tail 50
            throw "Smoke test failed (Exited=$exited, ExitCode=$($process.ExitCode))"
          }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Ensemble-${{ env.ID }}-windows-x86_64
          path: Ensemble-${{ env.ID }}-windows-x86_64*.zip
          if-no-files-found: error

  jit:
    name: JIT (Linux + Windows, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EnsembleJit: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Identify build
        run: |
          set -euo pipefail
          id="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || id="$(git rev-parse --short HEAD)"
          echo "ID=${id}" >> "${GITHUB_ENV}"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d "${HOME}/godot"
          unzip -q templates.tpz -d "${HOME}/tpl"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          mv "${HOME}/tpl/templates" "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          bin="${HOME}/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64"
          chmod +x "${bin}"
          echo "GODOT=${bin}" >> "${GITHUB_ENV}"

      - name: Neuter Terrain3D editor plugin
        run: mv addons/terrain_3d/plugin.cfg addons/terrain_3d/plugin.cfg.off

      - name: Disable threaded import
        run: printf '\n[editor]\n\nimport/use_multiple_threads=false\n' >> project.godot

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportDebug --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-debug "Linux (x86_64)" "${PWD}/out/Ensemble.x86_64"
          "${GODOT}" --headless --path . --export-debug "Microslop Windows (x86_64)" "${PWD}/out/Ensemble.exe"
          test -s out/Ensemble.x86_64
          test -s out/Ensemble.exe
          test -s out/data_EnsembleGame_linuxbsd_x86_64/EnsembleGame.dll
          test -s out/data_EnsembleGame_windows_x86_64/EnsembleGame.dll
          chmod +x out/Ensemble.x86_64 out/Ensemble.sh

      - name: Package
        run: |
          set -euo pipefail
          cd out
          zip -6 -ry "../Ensemble-${ID}-jit.zip" .

      - name: Smoke test (Linux)
        run: |
          set -euo pipefail
          cd out
          timeout 120 ./Ensemble.x86_64 --headless --quit-after 900 -- --port=7777 > ../smoke.log 2>&1 || { tail -50 ../smoke.log; exit 1; }
          grep -qF 'Instantiated and added "WorldHandle"' ../smoke.log || { tail -50 ../smoke.log; exit 1; }

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Ensemble-${{ env.ID }}-jit
          path: Ensemble-${{ env.ID }}-jit.zip
          if-no-files-found: error

  jit-windows:
    name: JIT (Windows smoke test)
    needs: jit
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          pattern: Ensemble-*-jit
          merge-multiple: true

      - name: Smoke test
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          7z x -ojit (Get-ChildItem *-jit.zip).FullName > $null
          $process = Start-Process jit\Ensemble.console.exe -ArgumentList '--headless', '--quit-after', '900', '--', '--port=7777' `
            -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err.log -NoNewWindow -PassThru
          $null = $process.Handle
          $exited = $process.WaitForExit(120000)
          Get-Process Ensemble* -ErrorAction SilentlyContinue | Stop-Process -Force
          $found = Select-String -Path smoke.log -Pattern 'Instantiated and added "WorldHandle"' -SimpleMatch -Quiet
          if (-not $exited -or $process.ExitCode -ne 0 -or -not $found) {
            Get-Content smoke.log, smoke.err.log -Tail 50
            throw "Smoke test failed (Exited=$exited, ExitCode=$($process.ExitCode))"
          }

  publish:
    name: Publish
    needs: [ linux, macos, windows, jit, jit-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" --generate-notes *.zip SHA256SUMS.txt
