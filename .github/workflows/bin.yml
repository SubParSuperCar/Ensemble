name: Build Binaries (CI/CD)

on:
  workflow_dispatch:
    inputs:
      itch:
        description: Push the builds to itch.io
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: bin-${{ github.ref }}
  cancel-in-progress: true

# A step shared between jobs is a YAML anchor (&name) where it first appears and an alias (*name) after
jobs:
  # NativeAOT links against the runner's glibc, which a player's must be as new as, so these are the oldest images.
  # Arm devices (a Raspberry Pi, a Windows laptop on Arm) get a lean package alone.
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            extras: true
          - arch: arm64
            runner: ubuntu-22.04-arm

    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Godot editor keeps the SDK line in step with itself, so it's the one place the version is written
      - &godot-version
        name: Read Godot version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's|.*Sdk="Godot.NET.Sdk/\([^"]*\)".*|\1|p' EnsembleGame.csproj)"
          [ -n "${version}" ] || { echo "No Godot.NET.Sdk version in EnsembleGame.csproj" >&2; exit 1; }
          echo "GODOT_VERSION=${version}" >> "${GITHUB_ENV}"

      - &build-id
        name: Identify build
        shell: bash
        run: |
          set -euo pipefail
          id="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = tag ] || id="$(git rev-parse --short HEAD)"
          echo "ID=${id}" >> "${GITHUB_ENV}"

      - &dotnet
        name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Install NativeAOT toolchain
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # Godot names the runner's architecture as the kernel does, except Arm's
      - &godot-linux
        name: Set up Godot
        run: |
          set -euo pipefail
          arch="$(uname -m | sed 's/aarch64/arm64/')"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_linux_${arch}.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSL -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          verify() {
            [ "$(grep " ${2}\$" SHA512-SUMS.txt | cut -d' ' -f1)" = "$(shasum -a 512 "${1}" | cut -d' ' -f1)" ] ||
              { echo "Checksum mismatch: ${2}" >&2; exit 1; }
          }
          verify godot.zip "Godot_v${GODOT_VERSION}-stable_mono_linux_${arch}.zip"
          verify templates.tpz "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d "${HOME}/godot"
          unzip -q templates.tpz -d "${HOME}/tpl"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          mv "${HOME}/tpl/templates" "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          name="Godot_v${GODOT_VERSION}-stable_mono_linux"
          bin="${HOME}/godot/${name}_${arch}/${name}.${arch}"
          chmod +x "${bin}"
          echo "GODOT=${bin}" >> "${GITHUB_ENV}"

      - &terrain3d
        name: Neuter Terrain3D editor plugin
        shell: bash
        run: mv addons/terrain_3d/plugin.cfg addons/terrain_3d/plugin.cfg.off

      - &threaded-import
        name: Disable threaded import
        shell: bash
        run: printf '\n[editor]\n\nimport/use_multiple_threads=false\n' >> project.godot

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportRelease --no-restore
          # The headless editor loads the Debug build's scripts; without them, scenes export through placeholder
          # scripts, which drop exported node arrays (e.g., Paintable.Excluded)
          dotnet build EnsembleGame.csproj --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-release "Linux (${ARCH})" "${PWD}/out/Ensemble.${ARCH}"
          test -s "out/Ensemble.${ARCH}"
          cd out
          shopt -s nullglob
          for d in data_*/; do cp -a "${d}." . && find "${d}" -mindepth 1 -delete; done
          chmod +x "Ensemble.${ARCH}" Ensemble.sh

      - name: Package debug
        if: matrix.extras
        run: |
          set -euo pipefail
          cd out
          cp ../.github/scripts/symbolize.sh .
          zip -6 -ry "../Ensemble-${ID}-linux-${ARCH}-debug.zip" .
          rm symbolize.sh

      - name: Package
        run: |
          set -euo pipefail
          cd out
          rm -f ./*.pdb ./*.dbg ./*.xml
          zip -6 -ry "../Ensemble-${ID}-linux-${ARCH}.zip" .

      - name: Export server
        if: matrix.extras
        timeout-minutes: 30
        env:
          EnsembleServer: true
        run: |
          set -euo pipefail
          mkdir -p server
          "${GODOT}" --headless --path . --export-release "Linux (x86_64) Server" "${PWD}/server/Ensemble.x86_64"
          test -s server/Ensemble.x86_64
          cd server
          shopt -s nullglob
          for d in data_*/; do cp -a "${d}." . && find "${d}" -mindepth 1 -delete; done
          rm -f ./*.pdb ./*.dbg ./*.xml
          chmod +x Ensemble.x86_64 Ensemble.sh
          zip -6 -ry "../Ensemble-${ID}-linux-x86_64-server.zip" .

      - &smoke-linux
        name: Smoke test
        run: |
          set -euo pipefail
          exe="./Ensemble.$(uname -m | sed 's/aarch64/arm64/')"
          for dir in out server; do
            [ -d "${dir}" ] || continue
            (cd "${dir}" && timeout 120 "${exe}" --headless --quit-after 900 -- --port=7777) \
              > smoke.log 2>&1 || { tail -50 smoke.log; exit 1; }
            grep -qE 'Instantiated and added "?WorldHandle' smoke.log || { tail -50 smoke.log; exit 1; }
          done

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ensemble-${{ env.ID }}-linux-${{ matrix.arch }}
          path: Ensemble-${{ env.ID }}-linux-${{ matrix.arch }}*.zip
          if-no-files-found: error

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - *checkout

      - *godot-version

      - *build-id

      - *dotnet

      - name: Set up Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSL -o SHA512-SUMS.txt "${base}/SHA512-SUMS.txt"
          verify() {
            [ "$(grep " ${2}\$" SHA512-SUMS.txt | cut -d' ' -f1)" = "$(shasum -a 512 "${1}" | cut -d' ' -f1)" ] ||
              { echo "Checksum mismatch: ${2}" >&2; exit 1; }
          }
          verify godot.zip "Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          verify templates.tpz "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          unzip -q godot.zip -d "${HOME}/godot"
          unzip -q templates.tpz -d "${HOME}/tpl"
          template_dir="${HOME}/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "${template_dir}"
          mv "${HOME}/tpl/templates"/* "${template_dir}/"
          bin="${HOME}/godot/Godot_mono.app/Contents/MacOS/Godot"
          chmod +x "${bin}"
          echo "GODOT=${bin}" >> "${GITHUB_ENV}"

      - *terrain3d

      - *threaded-import

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportRelease --no-restore
          # The headless editor loads the Debug build's scripts; without them, scenes export through placeholder
          # scripts, which drop exported node arrays (e.g., Paintable.Excluded)
          dotnet build EnsembleGame.csproj --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-release "Crapple Macintosh OS" "${PWD}/out/Ensemble.app"
          test -d out/Ensemble.app
          test -s out/Ensemble.app/Contents/MacOS/Ensemble

      - name: Package
        run: |
          set -euo pipefail
          cd out
          codesign --verify --deep --strict Ensemble.app
          ditto -c -k --sequesterRsrc --keepParent Ensemble.app "../Ensemble-${ID}-macos-universal-debug.zip"
          find Ensemble.app -name '*.pdb' -delete
          find Ensemble.app -name '*.dSYM' -type d -exec rm -rf {} +
          codesign --force --deep --sign - Ensemble.app
          codesign --verify --deep --strict Ensemble.app
          ditto -c -k --sequesterRsrc --keepParent Ensemble.app "../Ensemble-${ID}-macos-universal.zip"

      - name: Export server
        timeout-minutes: 30
        env:
          EnsembleServer: true
        run: |
          set -euo pipefail
          mkdir -p server
          "${GODOT}" --headless --path . --export-release "Crapple Macintosh OS Server" "${PWD}/server/Ensemble.app"
          test -s server/Ensemble.app/Contents/MacOS/Ensemble
          cd server
          find Ensemble.app -name '*.pdb' -delete
          find Ensemble.app -name '*.dSYM' -type d -exec rm -rf {} +
          codesign --force --deep --sign - Ensemble.app
          codesign --verify --deep --strict Ensemble.app
          ditto -c -k --sequesterRsrc --keepParent Ensemble.app "../Ensemble-${ID}-macos-universal-server.zip"

      - name: Smoke test
        run: |
          set -euo pipefail
          for dir in out server; do
            perl -e 'alarm shift; exec @ARGV' 120 "${dir}/Ensemble.app/Contents/MacOS/Ensemble" \
              --headless --quit-after 900 -- --port=7777 > smoke.log 2>&1 || { tail -50 smoke.log; exit 1; }
            grep -qE 'Instantiated and added "?WorldHandle' smoke.log || { tail -50 smoke.log; exit 1; }
          done

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ensemble-${{ env.ID }}-macos-universal
          path: Ensemble-${{ env.ID }}-macos-universal*.zip
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
            godot: win64
            extras: true
          - arch: arm64
            runner: windows-11-arm
            godot: windows_arm64

    env:
      ARCH: ${{ matrix.arch }}
      GODOT_BUILD: ${{ matrix.godot }}

    defaults:
      run:
        shell: pwsh

    steps:
      - *checkout

      - *godot-version

      - *build-id

      - *dotnet

      - name: Set up Godot
        run: |
          $base = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_$env:GODOT_BUILD.zip" -OutFile godot.zip
          Invoke-WebRequest "$base/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" -OutFile templates.tpz
          Invoke-WebRequest "$base/SHA512-SUMS.txt" -OutFile SHA512-SUMS.txt
          $sums = Get-Content SHA512-SUMS.txt
          $files = @{
            'godot.zip' = "Godot_v$env:GODOT_VERSION-stable_mono_$env:GODOT_BUILD.zip"
            'templates.tpz' = "Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz"
          }
          foreach ($file in $files.GetEnumerator()) {
            $expected = (($sums | Where-Object { $_.EndsWith("  $($file.Value)") }) -split ' ')[0]
            if ((Get-FileHash $file.Key -Algorithm SHA512).Hash -ne $expected) {
              throw "Checksum mismatch: $($file.Value)"
            }
          }
          Expand-Archive godot.zip -DestinationPath C:\godot -Force
          Expand-Archive templates.tpz -DestinationPath C:\tpl -Force
          $dest = "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Move-Item C:\tpl\templates\* $dest -Force
          $name = "Godot_v$env:GODOT_VERSION-stable_mono_$env:GODOT_BUILD"
          "GODOT=C:\godot\$name\${name}_console.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - *terrain3d

      - *threaded-import

      - name: Export
        timeout-minutes: 45
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet build EnsembleGame.csproj -c ExportRelease
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
          # The headless editor loads the Debug build's scripts; without them, scenes export through placeholder
          # scripts, which drop exported node arrays (e.g., Paintable.Excluded)
          dotnet build EnsembleGame.csproj
          if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
          .github\scripts\godot.ps1 --import
          .github\scripts\godot.ps1 --import
          New-Item -ItemType Directory -Force out | Out-Null
          .github\scripts\godot.ps1 --export-release "Microslop Windows ($env:ARCH)" "$PWD\out\Ensemble.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path out\Ensemble.exe) -or (Get-Item out\Ensemble.exe).Length -eq 0) {
            throw "Ensemble.exe missing or empty after export"
          }
          Set-Location out
          Get-ChildItem -Directory -Filter data_* | ForEach-Object {
            Copy-Item "$($_.FullName)\*" . -Recurse -Force
            Remove-Item "$($_.FullName)\*" -Recurse -Force
          }

      - name: Package debug
        if: matrix.extras
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location out
          7z a -tzip -mx=5 -mmt=on "..\Ensemble-${env:ID}-windows-${env:ARCH}-debug.zip" . > $null

      - name: Package
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location out
          Remove-Item *.pdb, *.xml -Force -ErrorAction SilentlyContinue
          7z a -tzip -mx=5 -mmt=on "..\Ensemble-${env:ID}-windows-${env:ARCH}.zip" . > $null

      - name: Export server
        if: matrix.extras
        timeout-minutes: 30
        env:
          EnsembleServer: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force server | Out-Null
          .github\scripts\godot.ps1 --export-release "Microslop Windows (x86_64) Server" "$PWD\server\Ensemble.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path server\Ensemble.exe) -or (Get-Item server\Ensemble.exe).Length -eq 0) {
            throw "Server's Ensemble.exe missing or empty after export"
          }
          Set-Location server
          Get-ChildItem -Directory -Filter data_* | ForEach-Object {
            Copy-Item "$($_.FullName)\*" . -Recurse -Force
            Remove-Item "$($_.FullName)\*" -Recurse -Force
          }
          Remove-Item *.pdb, *.xml -Force -ErrorAction SilentlyContinue
          7z a -tzip -mx=5 -mmt=on "..\Ensemble-${env:ID}-windows-x86_64-server.zip" . > $null

      - &smoke-windows
        name: Smoke test
        run: |
          foreach ($dir in @('out', 'server') | Where-Object { Test-Path $_ }) {
            $process = Start-Process "$dir\Ensemble.console.exe" `
              -ArgumentList '--headless', '--quit-after', '900', '--', '--port=7777' `
              -RedirectStandardOutput smoke.log -RedirectStandardError smoke.err.log -NoNewWindow -PassThru
            $null = $process.Handle
            $exited = $process.WaitForExit(120000)
            Get-Process Ensemble* -ErrorAction SilentlyContinue | Stop-Process -Force
            $found = Select-String -Path smoke.log -Pattern 'Instantiated and added "?WorldHandle' -Quiet
            if (-not $exited -or $process.ExitCode -ne 0 -or -not $found) {
              Get-Content smoke.log, smoke.err.log -Tail 50
              throw "Smoke test of $dir failed (Exited=$exited, ExitCode=$($process.ExitCode))"
            }
          }

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ensemble-${{ env.ID }}-windows-${{ matrix.arch }}
          path: Ensemble-${{ env.ID }}-windows-${{ matrix.arch }}*.zip
          if-no-files-found: error

  jit:
    name: JIT (Linux + Windows, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - *checkout

      - *godot-version

      - *build-id

      - *dotnet

      - *godot-linux

      - *terrain3d

      - *threaded-import

      - name: Export
        timeout-minutes: 45
        run: |
          set -euo pipefail
          dotnet restore EnsembleGame.csproj
          dotnet build EnsembleGame.csproj -c ExportDebug --no-restore
          # The headless editor loads the Debug build's scripts; without them, scenes export through placeholder
          # scripts, which drop exported node arrays (e.g., Paintable.Excluded)
          dotnet build EnsembleGame.csproj --no-restore
          "${GODOT}" --headless --path . --import || true
          "${GODOT}" --headless --path . --import || true
          mkdir -p out
          "${GODOT}" --headless --path . --export-debug "Linux (x86_64)" "${PWD}/out/Ensemble.x86_64"
          "${GODOT}" --headless --path . --export-debug "Microslop Windows (x86_64)" "${PWD}/out/Ensemble.exe"
          test -s out/Ensemble.x86_64
          test -s out/Ensemble.exe
          test -s out/data_EnsembleGame_linuxbsd_x86_64/EnsembleGame.dll
          test -s out/data_EnsembleGame_windows_x86_64/EnsembleGame.dll
          chmod +x out/Ensemble.x86_64 out/Ensemble.sh

      - name: Package
        run: |
          set -euo pipefail
          cd out
          zip -6 -ry "../Ensemble-${ID}-jit-x86_64.zip" .

      - name: Export server
        timeout-minutes: 30
        env:
          EnsembleServer: true
        run: |
          set -euo pipefail
          mkdir -p server
          "${GODOT}" --headless --path . --export-debug "Linux (x86_64) Server" "${PWD}/server/Ensemble.x86_64"
          "${GODOT}" --headless --path . --export-debug "Microslop Windows (x86_64) Server" "${PWD}/server/Ensemble.exe"
          test -s server/data_EnsembleGame_linuxbsd_x86_64/EnsembleGame.dll
          test -s server/data_EnsembleGame_windows_x86_64/EnsembleGame.dll
          chmod +x server/Ensemble.x86_64 server/Ensemble.sh
          cd server
          zip -6 -ry "../Ensemble-${ID}-jit-x86_64-server.zip" .

      - *smoke-linux

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ensemble-${{ env.ID }}-jit-x86_64
          path: Ensemble-${{ env.ID }}-jit-x86_64*.zip
          if-no-files-found: error

  jit-windows:
    name: JIT (Windows smoke test, x86_64)
    needs: jit
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Ensemble-*-jit-x86_64
          merge-multiple: true

      - name: Extract
        run: |
          7z x -oout (Get-ChildItem *-jit-x86_64.zip).FullName > $null
          7z x -oserver (Get-ChildItem *-jit-x86_64-server.zip).FullName > $null

      - *smoke-windows

  publish:
    name: Publish
    needs: [ linux, macos, windows, jit, jit-windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          # A tag with a suffix (v1.2.3-rc.1) is a pre-release, which the game's update check and "latest" skip
          prerelease=()
          [[ "${GITHUB_REF_NAME}" != *-* ]] || prerelease=(--prerelease)
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${prerelease[@]}" \
            --title "${GITHUB_REF_NAME}" --generate-notes *.zip SHA256SUMS.txt

  itch:
    name: Publish to itch.io
    needs: [ linux, macos, windows, jit, jit-windows ]
    if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')) || inputs.itch
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BUTLER_VERSION: 15.32.0
      BUTLER_SHA256: 2335971394ef6596f95ded0833e85ee28755e13761716ef4c91d6b11f69162f5
      ITCH_GAME: subparsupercar/ensemble

    steps:
      - name: Download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Set up Butler
        run: |
          set -euo pipefail
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default"
          echo "${BUTLER_SHA256}  butler.zip" | sha256sum -c -
          unzip -q butler.zip -d "${HOME}/butler"
          chmod +x "${HOME}/butler/butler"

      # itch.io reads each build's platform from its channel's name, and patches players from folders, not archives
      - name: Push
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          push() {
            zip="$(echo dist/Ensemble-*-"${1}.zip")"
            id="${zip#dist/Ensemble-}"
            id="${id%"-${1}.zip"}"
            mkdir -p "itch/${2}"
            unzip -q "${zip}" -d "itch/${2}"
            "${HOME}/butler/butler" push "itch/${2}" "${ITCH_GAME}:${2}" --userversion "${id#v}"
          }
          push linux-x86_64 linux-alpha
          push macos-universal osx-alpha
          push windows-x86_64 windows-alpha
