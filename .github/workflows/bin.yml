name: Publish Release Binaries

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            preset: Linux\ (x86_64)
            output: builds/linux-x86_64
          - os: windows-latest
            rid: win-x64
            preset: Windows\ (x86_64)
            output: builds/win-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - run: dotnet publish Game.csproj -c Release -r ${{ matrix.rid }}

      - uses: firebelley/godot-export@v7
        with:
          godot-version: 4.7.1
          use-dotnet: true
          relative-project-path: .
          presets-to-export: ${{ matrix.preset }}

      - if: runner.os == 'Linux'
        run: |
          cd ${{ matrix.output }}
          zip -r ../../Ensemble-${{ matrix.rid }}.zip .

      - if: runner.os == 'Windows'
        run: Compress-Archive -Path "${{ matrix.output }}\*" -DestinationPath "Ensemble-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Ensemble-${{ matrix.rid }}
          path: Ensemble-${{ matrix.rid }}.zip
