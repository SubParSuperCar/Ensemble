name: Publish Release Binaries

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  publish:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            preset: Linux (x86_64)
            godot_binary: Godot_v4.7.1-stable_mono_linux.x86_64

          - os: windows-latest
            name: win-x86_64
            preset: Windows (x86_64)
            godot_binary: Godot_v4.7.1-stable_mono_win64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4

      - name: Install Godot
        shell: bash
        run: |
          mkdir godot

          if [ "${{ runner.os }}" = "Linux" ]; then
            curl -L \
              https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_linux_x86_64.zip \
              -o godot.zip

            unzip -q godot.zip -d godot

            chmod +x godot/${{ matrix.godot_binary }}

          else
            curl -L \
              https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_win64.zip \
              -o godot.zip

            unzip -q godot.zip -d godot
          fi

      - name: Install Export Templates
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            mkdir -p ~/.local/share/godot/export_templates/4.7.1.stable.mono
            curl -L \
              https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz \
              -o templates.tpz

            unzip -q templates.tpz \
              -d ~/.local/share/godot/export_templates/4.7.1.stable.mono

          else
            mkdir -p "$APPDATA/Godot/export_templates/4.7.1.stable.mono"

            curl -L \
              https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_mono_export_templates.tpz \
              -o templates.tpz

            tar -xf templates.tpz \
              -C "$APPDATA/Godot/export_templates/4.7.1.stable.mono"
          fi

      - name: Export
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            godot/godot \
              --headless \
              --export-release "${{ matrix.preset }}"

          else
            ./godot/${{ matrix.godot_binary }} \
              --headless \
              --export-release "${{ matrix.preset }}"
          fi

      - name: Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            cd builds/linux-x86_64
            zip -r ../../Ensemble-${{ matrix.name }}.zip .

          else
            cd builds/win-x86_64
            powershell Compress-Archive \
              -Path * \
              -DestinationPath ../../Ensemble-${{ matrix.name }}.zip
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Ensemble-${{ matrix.name }}
          path: Ensemble-${{ matrix.name }}.zip
