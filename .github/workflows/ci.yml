name: Export Release Binaries

on:
  push:
    branches:
      - main
      - test
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail

          mkdir godot

          curl -L \
            -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"

          unzip -q godot.zip -d godot

          GODOT_BIN=$(find godot -maxdepth 2 -type f -name "Godot_v${GODOT_VERSION}-stable_mono_linux*" | head -n1)

          if [ -z "$GODOT_BIN" ]; then
            echo "Godot executable not found"
            exit 1
          fi

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$PWD/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir templates

          curl -L \
            -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"

          unzip -q templates.tpz -d templates

          mkdir -p ~/.local/share/godot/export_templates

          mv \
            templates/templates \
            ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --import

      - name: Build .NET solution
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --build-solutions \
            --quit

      - name: Export
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p builds/linux-x86_64

          "$GODOT_BIN" \
            --headless \
            --export-release "Linux (x86_64)" \
            builds/linux-x86_64/Ensemble.x86_64

      - name: Move native libraries
        shell: bash
        run: |
          set -euo pipefail

          DATA_DIR=$(find builds/linux-x86_64 -maxdepth 1 -type d -name "data_*" | head -n1)

          if [ -n "$DATA_DIR" ]; then
            mv "$DATA_DIR"/libSkiaSharp.so builds/linux-x86_64/
            mv "$DATA_DIR"/libHarfBuzzSharp.so builds/linux-x86_64/
            mv "$DATA_DIR"/libonigwrap.so builds/linux-x86_64/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ensemble-linux-x86_64
          path: builds/linux-x86_64


  windows:
    name: Windows (x86_64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Godot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force godot | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/Godot_v$env:GODOT_VERSION-stable_mono_win64.zip" `
            -OutFile godot.zip

          Expand-Archive godot.zip -DestinationPath godot

          $godot = Get-ChildItem `
            -Path godot `
            -Recurse `
            -Filter "Godot_v$env:GODOT_VERSION-stable_mono_win64.exe" |
            Select-Object -First 1

          if ($null -eq $godot) {
            throw "Godot executable not found"
          }

          "GODOT_BIN=$($godot.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Install export templates
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force templates | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable/Godot_v$env:GODOT_VERSION-stable_mono_export_templates.tpz" `
            -OutFile templates.tpz

          Expand-Archive templates.tpz -DestinationPath templates

          New-Item `
            -ItemType Directory `
            -Force `
            "$env:APPDATA\Godot\export_templates" | Out-Null

          Move-Item `
            templates\templates `
            "$env:APPDATA\Godot\export_templates\$env:GODOT_VERSION.stable.mono"

      - name: Import project
        shell: pwsh
        run: |
          & "$env:GODOT_BIN" `
            --headless `
            --import

          if ($LASTEXITCODE -ne 0) {
            throw "Godot project import failed"
          }

      - name: Build .NET solution
        shell: pwsh
        run: |
          & "$env:GODOT_BIN" `
            --headless `
            --build-solutions `
            --quit

          if ($LASTEXITCODE -ne 0) {
            throw "Godot C# build failed"
          }

      - name: Verify C# build output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter "*.dll" |
            Select-Object FullName

      - name: Export
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            builds\windows-x86_64 | Out-Null

          & "$env:GODOT_BIN" `
            --headless `
            --export-release "Microslop Windows (x86_64)" `
            builds\windows-x86_64\Ensemble.exe

          if ($LASTEXITCODE -ne 0) {
            throw "Godot export failed"
          }

          if (!(Test-Path "builds\windows-x86_64\Ensemble.exe")) {
            throw "Ensemble.exe was not created"
          }

      - name: Inspect Windows export
        shell: pwsh
        run: |
          Get-ChildItem -Recurse builds

      - name: Move native libraries
        shell: pwsh
        run: |
          $output = "builds\windows-x86_64"

          $dataDir = Get-ChildItem `
            $output `
            -Directory `
            -Filter "data_*" |
            Select-Object -First 1

          if ($null -ne $dataDir) {
            Move-Item "$($dataDir.FullName)\SkiaSharp.dll" $output -ErrorAction SilentlyContinue
            Move-Item "$($dataDir.FullName)\HarfBuzzSharp.dll" $output -ErrorAction SilentlyContinue
            Move-Item "$($dataDir.FullName)\onigwrap.dll" $output -ErrorAction SilentlyContinue
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ensemble-windows-x86_64
          path: builds/windows-x86_64
