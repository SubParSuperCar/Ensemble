name: Upload Source Lines of Code

on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: read

concurrency:
  group: cloc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloc:
    name: Count
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Count source LoC
        uses: djdefi/cloc-action@d4a7e15e4ff5219692f79ba71685af08955dcfc0 # 6
        with:
          options: --exclude-dir=Estragonia,addons,.godot,bin,obj --exclude-lang=YAML --md --report-file=cloc.md

      - name: Upload LoC artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: src-loc
          path: cloc.md
          if-no-files-found: error
