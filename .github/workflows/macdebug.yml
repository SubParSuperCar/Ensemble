name: macdebug

on:
  push:
    branches: [ ci-mac-debug ]

env:
  GODOT_VERSION: 4.7.2

jobs:
  probe:
    name: probe (${{ matrix.variant }} ${{ matrix.rep }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [ split ]
        rep: [ 1, 2, 3, 4, 5, 6 ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Godot
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d "${HOME}/godot"
          echo "GODOT=${HOME}/godot/Godot_mono.app/Contents/MacOS/Godot" >> "${GITHUB_ENV}"
          mv addons/terrain_3d/plugin.cfg addons/terrain_3d/plugin.cfg.off

      - name: Apply variant
        run: |
          case "${{ matrix.variant }}" in
            never) rm -f assets/audio/*.mp3 assets/audio/*.mp3.import; cp alt/${{ matrix.variant }}/* assets/audio/ ;;
            no-mp3) rm -f assets/audio/*.mp3 assets/audio/*.mp3.import ;;
            no-resonate) mv addons/resonate/plugin.cfg addons/resonate/plugin.cfg.off ;;
          esac

      - name: Import
        run: |
          set -uo pipefail
          dotnet restore Game.csproj
          dotnet build Game.csproj -c ExportRelease --no-restore
          run_import() {
            "${GODOT}" --headless --path . --import > import.log 2>&1 &
            pid=$!
            for i in $(seq 1 24); do
              kill -0 $pid 2>/dev/null || return 0
              sleep 5
            done
            echo "HUNG after 120s"
            tail -3 import.log
            kill -9 $pid
            return 1
          }
          if [ "${{ matrix.variant }}" = split ]; then
            touch assets/audio/.gdignore
            run_import || exit 1
            rm assets/audio/.gdignore
          fi
          run_import || exit 1
          echo "import finished"
