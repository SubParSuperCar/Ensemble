name: Create Source Release

on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: write

concurrency:
  group: src-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare source
        run: |
          set -euo pipefail
          mkdir src
          rsync -a . src/ --exclude='.git' --exclude='src'

      - name: Create deterministic archive
        uses: timo-reymann/deterministic-zip-gh-action@7a36eed588fb801feb8f7ed7e75dd290b2d05b4f # v1
        with:
          source: src
          target: src.zip
          args: -i

      - name: Hash archive
        run: |
          set -euo pipefail
          sha256sum src.zip > src.zip.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="src-${GITHUB_SHA::12}"

          # The same commit can be pushed again, e.g., on a new branch
          if gh release view "${tag}" > /dev/null 2>&1; then
            echo "Release ${tag} already exists"
            exit 0
          fi

          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --generate-notes \
            src.zip src.zip.sha256
