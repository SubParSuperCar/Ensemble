name: Create Source Release

on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: write

concurrency:
  group: src-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare source
        run: |
          set -euo pipefail
          mkdir src
          rsync -a . src/ --exclude='.git' --exclude='src'

      - name: Create deterministic archive
        uses: timo-reymann/deterministic-zip-gh-action@v1
        with:
          source: src
          target: src.zip
          args: -i

      - name: Hash archive
        run: |
          set -euo pipefail
          sha256sum src.zip > src.zip.sha256

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "src-${GITHUB_SHA::12}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --generate-notes \
            src.zip src.zip.sha256
