name: Test

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test --solution Ensemble.slnx

      # So export-only code (e.g., UpdateChecker) is tested too
      - name: Test as exported
        run: dotnet test --project Tests/Tests.csproj -c ExportDebug

      # Server builds leave out code and packages that nothing else would notice them still depending on
      - name: Build server
        run: dotnet build EnsembleGame.csproj -c ExportRelease -p:EnsembleServer=true
