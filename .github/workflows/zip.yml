on:
  push:
    branches: [master]

jobs:
  job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: rm -rf .git

      - uses: timo-reymann/deterministic-zip-gh-action@v1
        with:
          source: .
          target: src.zip
          args: -i

      - run: sha256sum src.zip

      - uses: actions/upload-artifact@v4
        with:
          name: src
          path: src.zip
