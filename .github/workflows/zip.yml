on:
  push:
    branches:
      - master
      - test

jobs:
  job:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - shell: bash
        run: |
          set -euo pipefail
          mkdir src
          rsync -a . src/ \
            --exclude=.git \
            --exclude=.github \
            --exclude=src

      - uses: timo-reymann/deterministic-zip-gh-action@v1
        with:
          source: src
          target: src.zip
          args: -i

      - run: sha256sum src.zip > src.zip.sha256

      - shell: bash
        run: |
          set -euo pipefail
          TAG="build-${{ github.run_id }}"
          gh release create "$TAG" \
            --prerelease \
            --target "${{ github.sha }}" \
            --generate-notes \
            src.zip \
            src.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
