name: Create Source Release

on:
  push:
    branches-ignore:
      - 'dependabot/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare Source
        shell: bash
        run: |
          set -euo pipefail
          mkdir src
          rsync -a . src/ \
            --exclude='.git' \
            --exclude='src'

      - name: Create Deterministic Archive
        uses: timo-reymann/deterministic-zip-gh-action@v1
        with:
          source: src
          target: src.zip
          args: -i

      - name: Hash Archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum src.zip > src.zip.sha256

      - name: Create Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="src-${GITHUB_SHA::12}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --generate-notes \
            src.zip \
            src.zip.sha256
